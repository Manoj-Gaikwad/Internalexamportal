<mat-toolbar class="p-0 mat-elevation-z1">

  <div fxFlex fxFill fxLayout="row" fxLayoutAlign="start center">

    <div fxFlex="1 0 auto" fxLayout="row" fxLayoutAlign="start center">

      @if (!hiddenNavbar && !rightNavbar) {
        <button mat-icon-button class="navbar-toggle-button"
          (click)="toggleSidebarOpen('navbar')" fxHide.gt-md>
          <mat-icon class="secondary-text">menu</mat-icon>
        </button>
      }

      @if (!hiddenNavbar && !rightNavbar) {
        <div class="toolbar-separator" fxHide.gt-md></div>
      }

      @if (horizontalNavbar) {
        <div fxLayout="row" fxLayoutAlign="start center">
          <div class="logo ml-16">
            <img class="logo-icon" src="assets/images/logos/fuse.svg">
          </div>
        </div>
      }

      <div fxLayout="row" fxLayoutAlign="start center">
        <!-- <div class="logo ml-16">
        <img class="logo-icon" src="assets/images/logos/fuse.svg">
      </div> -->
      <div class="display-3 ml-16">{{user?.clientName}}</div>
    </div>

  </div>

  <div class="" fxFlex="0 1 auto" fxLayout="row" fxLayoutAlign="start center">

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button profile-toolbar">
      <div fxLayout="row" fxLayoutAlign="center center">
        @if (!user?.photo) {
          <img class="avatar mr-0 mr-sm-16" src="assets/images/avatars/Velazquez.jpg">
        }
        @if (user?.photo) {
          <img class="avatar mr-0 mr-sm-16" src="{{user?.photo}}">
        }
        <!-- <span class="username mr-12" fxHide fxShow.gt-sm>{{user?.firstName}} {{user?.lastName}}</span> -->
        <mat-icon class="s-16" fxHide.xs>keyboard_arrow_down</mat-icon>
      </div>
    </button>

    <mat-menu #userMenu="matMenu" [overlapTrigger]="false">


      <button mat-menu-item class="" (click)="profile()">
        <mat-icon>account_circle</mat-icon>
        <span>My Profile</span>
      </button>

      <button mat-menu-item class="change-password" (click)="openChangePasswordDialog()">
        <mat-icon>lock</mat-icon>
        <span>Change Password</span>
      </button>

      <button mat-menu-item class="" (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Logout</span>
      </button>

    </mat-menu>

    <div class="toolbar-separator"></div>

    <!-- <fuse-search-bar (input)="search($event)"></fuse-search-bar> -->

    <!-- <div class="toolbar-separator"></div>

    <button mat-button fxHide fxShow.gt-xs class="language-button" [matMenuTriggerFor]="languageMenu">
      <div fxLayout="row" fxLayoutAlign="center center">
        <img class="flag mr-8" [src]="'assets/icons/flags/'+selectedLanguage.flag+'.png'">
        <span class="iso text-uppercase">{{selectedLanguage.id}}</span>
      </div>
    </button>

    <mat-menu #languageMenu="matMenu" [overlapTrigger]="false">

      <button mat-menu-item *ngFor="let lang of languages" (click)="setLanguage(lang)">
        <span fxLayout="row" fxLayoutAlign="start center">
          <img class="flag mr-16" [src]="'assets/icons/flags/'+lang.flag+'.png'">
          <span class="iso">{{lang.title}}</span>
        </span>
      </button>

    </mat-menu> -->

    <div class="toolbar-separator" fxHide fxShow.gt-xs></div>

    @if (!hiddenNavbar && rightNavbar) {
      <div class="toolbar-separator" fxHide fxShow.gt-xs></div>
    }

    @if (!hiddenNavbar && rightNavbar) {
      <button mat-icon-button class="navbar-toggle-button"
        (click)="toggleSidebarOpen('navbar')" fxHide.gt-md>
        <mat-icon class="secondary-text">menu</mat-icon>
      </button>
    }

  </div>

</div>

</mat-toolbar>
