<div id="mail-confirm" fxLayout="column">

  <div id="mail-confirm-form-wrapper" fxLayout="column" fxLayoutAlign="center center">

    <div id="mail-confirm-form" class="custom-padding" [@animate]="{value:'*',params:{duration:'300ms',y:'100px'}}">

      <div class="logo">
        <mat-icon class="mat-accent s-96">email</mat-icon>
      </div>

      @if (isWorking) {
        <div class="title">Confirming your email address!</div>
      }
      @if (!isWorking) {
        <div class="title">Confirmed !</div>
      }

      @if (isWorking) {
        <mat-progress-spinner class="example-margin" color="primary" mode="indeterminate">
        </mat-progress-spinner>
      }
      @if (!isWorking) {
        <div class="logo">
          <mat-icon class="mat-accent s-96">check</mat-icon>
        </div>
      }

      <div class="message">
        <a class="link" [routerLink]="''">Go back to login page</a>
      </div>

    </div>

  </div>

</div>
